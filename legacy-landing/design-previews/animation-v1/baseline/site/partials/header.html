<header class="site-header" data-site-mode="{{site_mode}}">
  <div class="header-inner shell">
    <a class="brand" href="{{home_href}}" aria-label="{{brand_home_label}}">
      <img src="{{asset_root}}images/logo-dark.png" width="1671" height="416" alt="AIQME">
    </a>
    <button class="menu-button" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="{{menu_open}}" data-open-label="{{menu_open}}" data-close-label="{{menu_close}}">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-navigation" id="primary-navigation" aria-label="{{navigation_label}}">
      <a href="{{services_href}}">{{nav_services}}</a>
      <a href="{{process_href}}">{{nav_process}}</a>
      <a href="{{projects_href}}">{{nav_projects}}</a>
      <a href="{{about_href}}">{{nav_about}}</a>
      <a href="{{information_href}}">{{nav_information}}</a>
      <a href="{{calculator_href}}">{{nav_calculator}}</a>
      <a href="{{login_href}}">{{nav_login}}</a>
      <a href="{{contact_href}}">{{nav_contact}}</a>
      <div class="locale-switch">{{locale_switch}}</div>
      <a class="button button-primary header-cta" href="{{contact_href}}">{{nav_cta}} <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
