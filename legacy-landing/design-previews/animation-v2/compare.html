<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIQME — сравнение версий</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#edf2f9;color:#182b42;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;border-bottom:1px solid #cdd9e8;background:white;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}strong{margin-right:auto}nav{display:flex;gap:5px;background:#edf2f9;padding:4px;border-radius:12px}button,select,a{font:inherit}button,select{padding:8px 12px;border:1px solid #cbd9e9;background:white;color:#183858;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#0759dc;color:white;border-color:#0759dc}label{display:flex;align-items:center;gap:7px;font-size:12px}a{color:#0759dc}iframe{width:100%;flex:1;min-height:0;border:0;background:white}small{display:block;font-size:11px;color:#64748b}#status{padding:5px 20px;font-size:11px;min-height:25px}*:focus-visible{outline:3px solid #2166ee;outline-offset:2px}@media(max-width:600px){header{padding:8px 12px;gap:8px}strong{width:100%}button,select{padding:6px 9px;font-size:12px}#status{padding-inline:12px}#jump-label{display:none}}
</style></head><body>
<header><strong>AIQME <small>Три версии · мозаика и раскрытие фото</small></strong><nav aria-label="Версия сайта"><button type="button" data-version="original" aria-pressed="false">Обычная</button><button type="button" data-version="v1" aria-pressed="false">V1</button><button type="button" data-version="v2" aria-pressed="true">V2 · видео</button></nav><label hidden id="scene-label">Сцена<select id="scene-mode"><option value="sticky">Закрепление</option><option value="flow">Обычный поток</option></select></label><label id="jump-label">Раздел<select id="jump"><option value="top">Первый экран</option><option value="quick-calculator">Калькулятор</option><option value="possibilities">Мозаика</option><option value="services">Услуги</option><option value="process">Процесс</option><option value="case">Кейс / схема</option><option value="projects">Проекты</option><option value="about">О подходе · раскрытие фото</option><option value="information">Информация</option><option value="contact-form">Заявка</option></select></label><a id="open" href="v2/" target="_blank" rel="noopener">Открыть отдельно ↗</a></header>
<div id="status" role="status">Все версии работают в деморежиме: заявки не отправляются. Обычный сайт сохранён отдельно.</div>
<iframe id="preview" src="v2/" title="Сайт AIQME — версия с анимациями"></iframe>
<script>
(() => {
 const frame=document.querySelector('#preview');let version='v2',state=null;
 function capture(){try{const w=frame.contentWindow,d=w.document;const sections=[...d.querySelectorAll('main > section[id]')];let el=sections.filter(e=>e.getBoundingClientRect().top<=100).at(-1);const box=d.querySelector('#motion-case,.process-visual-band');if(box&&box.getBoundingClientRect().top<=100&&box.getBoundingClientRect().bottom>0)el=box;return el?{id:el===box?'case':el.id,p:Math.max(0,Math.min(1,-el.getBoundingClientRect().top/Math.max(1,el.offsetHeight-w.innerHeight)))}:{id:'top',p:0}}catch{return null}}
 function find(d,id){return id==='case'?d.querySelector('#motion-case,.process-visual-band'):d.getElementById(id)}
 function jump(id,p=0){try{const w=frame.contentWindow,el=find(w.document,id);w.scrollTo({top:el?el.getBoundingClientRect().top+w.scrollY-(w.document.querySelector('.site-header')?.offsetHeight||0)+Math.max(0,el.offsetHeight-w.innerHeight)*p:0,behavior:'instant'})}catch{}}
 function change(){state=capture();const query=version==='v1'&&document.querySelector('#scene-mode').value==='flow'?'?scene=flow':'';frame.src=version+'/'+query;frame.title='AIQME — '+version;document.querySelector('#open').href=frame.src;document.querySelector('#scene-label').hidden=version!=='v1';document.querySelectorAll('[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)))}
 document.querySelectorAll('[data-version]').forEach(b=>b.addEventListener('click',()=>{if(version!==b.dataset.version){version=b.dataset.version;change()}}));
 document.querySelector('#scene-mode').addEventListener('change',change);
 document.querySelector('#jump').addEventListener('change',e=>jump(e.target.value));
 frame.addEventListener('load',()=>{const saved=state;state=null;if(saved){try{frame.contentDocument.fonts.ready.then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>jump(saved.id,saved.p))))}catch{}}});
 if(location.protocol==='file:')document.querySelector('#status').textContent='Для сравнения запустите: python3 -m http.server 8824 --directory build/motion-v2 — затем откройте http://127.0.0.1:8824/';
})();
</script></body></html>
