# Локальные сервисы разработки AIQME (W-01). Все порты — только на 127.0.0.1.
# Пароль — явно фиктивный, только для локальной машины; рабочие секреты — в .env сервера (§6.6).
name: aiqme-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aiqme
      POSTGRES_USER: aiqme
      POSTGRES_PASSWORD: local-dev-only-not-a-secret
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqme -d aiqme"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:58025:8025"
      - "127.0.0.1:51025:1025"

volumes:
  postgres-data:
