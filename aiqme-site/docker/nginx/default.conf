# nginx приложения AIQME (W-20, §6.2, §6.4, §6.6): статика и /storage/… — сам, остальное — PHP-FPM сервиса app.

# Журнал доступа без гостевых адресов, ссылки сброса пароля и страницы оплаты (возврат с payment_intent_client_secret).
map $request_uri $loggable {
    ~^/lt/uzsakymas/      0;
    ~^/en/order/          0;
    ~^/lt/paskyra/reset/  0;
    ~^/en/account/reset/  0;
    ~^/lt/apmokejimas/    0;
    ~^/en/checkout/       0;
    default               1;
}

# Без $http_referer: Referer страниц ресурсов гостевого заказа содержит токен.
log_format aiqme '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log aiqme if=$loggable;
    # Только ошибки (413, таймаут upstream; §6.2): предупреждения о буферизации больших тел и ответов пишут referrer —
    # у скачивания STL со страницы гостя это адрес с токеном.
    error_log /var/log/nginx/error.log error;
    client_max_body_size 510m;
    server_tokens off;

    location / {
        # Только статике и /storage/…: ответам PHP те же заголовки ставит SecurityHeaders.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        # Имя app — через DNS Docker при каждом запросе: после перезапуска app его адрес может смениться.
        resolver 127.0.0.11 valid=10s;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
